services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: qa-agent-db
    environment:
      POSTGRES_USER: qaagent
      POSTGRES_PASSWORD: qaagent123
      POSTGRES_DB: qaagent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qaagent -d qaagent"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: qa-agent-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Self-hosted S3-compatible storage. Was MinIO; switched to SeaweedFS
  # because MinIO gated all its container images behind their own
  # login/subscription in 2025 — minio/minio is no longer pullable
  # anonymously on Docker Hub or quay.io. Credentials here are the same
  # throwaway dev defaults as before (qaagent/qaagent123), just baked into
  # deploy/s3-config.dev.json instead of env vars since SeaweedFS's S3
  # gateway has no env-var-only way to configure auth.
  minio:
    image: chrislusf/seaweedfs:latest
    container_name: qa-agent-minio
    ports:
      - "9000:9000"
    volumes:
      - miniodata:/data
      - ./deploy/s3-config.dev.json:/etc/seaweedfs/s3-config.json:ro
    command: server -dir=/data -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3-config.json
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:9000/ | grep -qE '^(200|403)$'"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: qa-agent-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/qaagent123
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
  miniodata:
  neo4jdata:
