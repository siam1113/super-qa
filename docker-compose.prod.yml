name: qa-agent-prod

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-qaagent}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME:-qaagent}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
      - ./init-db/01-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
      - ./apps/api/migrations:/migrations:ro
      - ./deploy/run-migrations.sh:/docker-entrypoint-initdb.d/01-run-migrations.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-qaagent} -d ${DATABASE_NAME:-qaagent}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - miniodata_prod:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4jdata_prod:/data
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - apps/api/.env.production
    environment:
      NODE_ENV: production
      PORT: 4000
      WEB_ORIGIN: https://${DOMAIN}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER:-qaagent}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME:-qaagent}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      AGENTS_API_URL: http://agents:8000
      AUTH_PUBLIC_URL: https://${DOMAIN}
      API_URL: https://${DOMAIN}
      MEETING_PUBLIC_API_URL: https://${DOMAIN}
      AUTONOMY_LOCKDOWN: "true"
      AUTONOMY_ALLOWED_ORIGINS: '["https://${DOMAIN}"]'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  agents:
    build:
      context: .
      dockerfile: agents/Dockerfile
    restart: unless-stopped
    env_file:
      - agents/.env.production
    environment:
      PORT: 8000
      REDIS_URL: redis://redis:6379
      BACKEND_API_URL: http://api:4000/api
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${DOMAIN}
        NEXT_PUBLIC_AGENTS_URL: https://${DOMAIN}/agents
    restart: unless-stopped
    environment:
      NODE_ENV: production
      AUTONOMY_API_URL: http://api:4000/api
      AUTH_PUBLIC_URL: https://${DOMAIN}
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
      - agents

volumes:
  pgdata_prod:
  redisdata_prod:
  miniodata_prod:
  neo4jdata_prod:
  caddy_data:
  caddy_config:
