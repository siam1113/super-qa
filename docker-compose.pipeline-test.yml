services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: pipeline_test
      POSTGRES_PASSWORD: pipeline_test
      POSTGRES_DB: pipeline_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline_test -d pipeline_test"]
      interval: 1s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30
