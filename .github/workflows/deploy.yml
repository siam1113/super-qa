name: Deploy

on:
  # Only deploys after the verification workflow has passed on main — never
  # deploys straight off a push, broken or not.
  workflow_run:
    workflows: ["Bounded autonomy verification"]
    types: [completed]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          # Forwarded into the remote script below. deploy/bootstrap-env.sh
          # picks these up and writes them into the server's env files —
          # fill these in as repo secrets and you never need to SSH in to
          # hand-edit .env files at all. Any left unset here fall back to
          # whatever's already on the server (or, for DOMAIN/API keys with
          # no safe default, deploy.sh stops and says what's missing).
          DOMAIN: ${{ secrets.DOMAIN }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AGENT_MEMORY_SIGNING_KEY: ${{ secrets.AGENT_MEMORY_SIGNING_KEY }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DOMAIN,DATABASE_PASSWORD,NEO4J_PASSWORD,S3_SECRET_KEY,ANTHROPIC_API_KEY,OPENAI_API_KEY,AGENT_MEMORY_SIGNING_KEY
          script: |
            set -e
            cd /opt/ultimate-qa-agent
            ./deploy/deploy.sh
